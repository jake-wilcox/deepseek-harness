name: Fork CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    if: github.repository != 'deepseek-ai/deepseek-harness'
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

  coverage:
    if: github.repository != 'deepseek-ai/deepseek-harness'
    name: Unit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DSH_COVERAGE_MAX_WORKERS: '3'
      DSH_GATE_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run complete unit-test coverage gate
        run: pnpm run check:ci:coverage

  documentation:
    if: github.repository != 'deepseek-ai/deepseek-harness'
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_GATE_CONCURRENCY: '3'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Validate documentation
        run: pnpm run doc-sync
